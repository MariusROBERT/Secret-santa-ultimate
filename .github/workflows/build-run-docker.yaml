name: Build and Run Docker image

on:
  pull_request:
    branches:
      - master

jobs:
  build_run_docker:
    name: Build and run docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Generate Drizzle migrations
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: svelte/package-lock.json

      - name: Generate migrations
        working-directory: svelte
        run: npm ci && npm run db:generate

      - name: Ensure migrations are committed
        run: |
          if [ -n "$(git status --porcelain -- svelte/drizzle)" ]; then
            echo "Drizzle migrations are out of date. Run npm run db:generate and commit the result."
            git status --short -- svelte/drizzle
            exit 1
          fi

      - name: Test fresh installs and upgrades
        working-directory: svelte
        run: npm run test:migrations

      - name: Build Docker image
        run: |
          docker build -t secret-santa-ultimate:${{ github.run_id }} .

      - name: Run container
        run: |
          docker run -d --name secret-santa-ultimate secret-santa-ultimate:${{ github.run_id }}

      - name: Check container status
        run: |
          ATTEMPTS=12
          INTERVAL=10
          
          for ((i=1; i<=ATTEMPTS; i++)); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' secret-santa-ultimate)
            echo "Attempt $i/$ATTEMPTS — status: $STATUS"
      
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
      
            if [ "$STATUS" = "unhealthy" ]; then
              docker logs secret-santa-ultimate
              exit 1
            fi
      
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $INTERVAL
            fi
          done

          docker logs secret-santa-ultimate
          exit 1

      - name: Cleanup image
        if: always()
        run: docker rmi -f secret-santa-ultimate:${{ github.run_id }}
