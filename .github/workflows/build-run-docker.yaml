name: Build and Run Docker image

on:
  pull_request:
    branches:
      - master

jobs:
  build_run_docker:
    name: Build and run docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Generate and track Drizzle migrations
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: svelte/package-lock.json

      - name: Generate migrations
        working-directory: svelte
        run: npm ci && npm run db:generate

      - name: Test fresh installs and upgrades
        working-directory: svelte
        run: npm run test:migrations

      - name: Commit generated migrations
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add svelte/drizzle
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate database migrations"
            git push
          fi

      - name: Build Docker image
        run: |
          docker build -t secret-santa-ultimate:${{ github.run_id }} .

      - name: Run container
        run: |
          docker run -d --name secret-santa-ultimate secret-santa-ultimate:${{ github.run_id }}

      - name: Check container status
        run: |
          ATTEMPTS=12
          INTERVAL=10
          
          for ((i=1; i<=ATTEMPTS; i++)); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' secret-santa-ultimate)
            echo "Attempt $i/$ATTEMPTS — status: $STATUS"
      
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
      
            if [ "$STATUS" = "unhealthy" ]; then
              docker logs secret-santa-ultimate
              exit 1
            fi
      
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $INTERVAL
            fi
          done

          docker logs secret-santa-ultimate
          exit 1

      - name: Cleanup image
        if: always()
        run: docker rmi -f secret-santa-ultimate:${{ github.run_id }}
